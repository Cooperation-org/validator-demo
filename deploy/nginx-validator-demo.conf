# Install: sudo cp deploy/nginx-validator-demo.conf /etc/nginx/app-proxies/validator-demo.conf
#          sudo nginx -t && sudo systemctl reload nginx
# validator-demo: candidate verification demo (Modern.js app + BFF API). Review by 2026-11-22
# App: modern serve on 127.0.0.1:3060 (tmp-validator-demo.service), built with APP_BASE_PATH=/validator-demo
# The app serves pages under /validator-demo/, but its BFF API at /api/ and built assets at /static/.

location = /validator-demo { return 301 /validator-demo/; }
location /validator-demo/static/ {
    proxy_pass http://127.0.0.1:3060/static/;
    proxy_set_header Host $host;
}
location /validator-demo/api/ {
    proxy_pass http://127.0.0.1:3060/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}
location /validator-demo/ {
    proxy_pass http://127.0.0.1:3060;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}
